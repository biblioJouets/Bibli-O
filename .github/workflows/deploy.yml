name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. Aller dans le BON dossier (Nouvelle adresse !)
            cd /home/lucas/Bibli-O

            # 2. Sauvegarder vos clés API
            cp .env.production /tmp/.env.production.backup 2>/dev/null || true

            # 3. Récupérer le code
            git pull origin main

            # 4. Restaurer les clés API
            cp /tmp/.env.production.backup .env.production 2>/dev/null || true

            # 5. Relancer (Plus besoin de sudo car lucas est dans le groupe docker)
            docker compose up -d --build

            # 6. Colonnes blog absentes si la migration Prisma n'a pas été jouée
            docker compose exec -T db psql -U lucas -d biblio_jouets -v ON_ERROR_STOP=1 <<'SQL'
            CREATE TABLE IF NOT EXISTS "BlogPost" (
                "id" SERIAL NOT NULL,
                "title" VARCHAR(255) NOT NULL,
                "slug" VARCHAR(300) NOT NULL,
                "thumbnail" VARCHAR(500),
                "category" VARCHAR(100) NOT NULL,
                "excerpt" TEXT,
                "metaDescription" TEXT,
                "author" VARCHAR(255) NOT NULL DEFAULT 'L''équipe Bibli''o',
                "readTime" VARCHAR(20),
                "content" JSONB NOT NULL DEFAULT '[]',
                "isPublished" BOOLEAN NOT NULL DEFAULT false,
                "accentColor" VARCHAR(20),
                "contentWidth" VARCHAR(20) DEFAULT 'Standard',
                "spacing" INTEGER DEFAULT 5,
                "createdAt" TIMESTAMPTZ(6) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                "updatedAt" TIMESTAMPTZ(6) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT "BlogPost_pkey" PRIMARY KEY ("id")
            );
            CREATE UNIQUE INDEX IF NOT EXISTS "BlogPost_slug_key" ON "BlogPost"("slug");
            ALTER TABLE "BlogPost" ADD COLUMN IF NOT EXISTS "metaDescription" TEXT;
            ALTER TABLE "BlogPost" ADD COLUMN IF NOT EXISTS "accentColor" VARCHAR(20);
            ALTER TABLE "BlogPost" ADD COLUMN IF NOT EXISTS "contentWidth" VARCHAR(20) DEFAULT 'Standard';
            ALTER TABLE "BlogPost" ADD COLUMN IF NOT EXISTS "spacing" INTEGER DEFAULT 5;
            SQL

            # 7. Nettoyer
            docker image prune -f